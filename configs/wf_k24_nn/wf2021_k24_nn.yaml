experiment: wf2021_k24_nn
env:
  environment:
    seed: 42
    initial_balance_jpy: 1000000.0
    episode_max_steps: 512
    window_size: 32
    max_leverage: 5.0
    margin_call_threshold: 0.2
    allow_action_leverage: false
    random_start: true
    currency_pairs:
    - JPY/USD
    - JPY/EUR
  data:
    provider: file
    timeframe: 1h
    path: data/jpy_usd_eur_1h_long.parquet
  features:
    volatility_window: 32
    normalize: false
    selected:
    - log_return
    - volatility
    - sma20_ratio
    - macd_ratio
    - atr14_ratio
    - mom24
    - mom72
    - mom168
  transaction_costs:
    commission_rate: 0.0
    overnight_rate: 5.0e-05
    carry_mode: none
    spreads:
      JPY/USD: 1.5e-05
      JPY/EUR: 2.5e-05
train_range:
  start: '2015-01-01'
  end: '2020-07-01'
val_range:
  start: '2020-07-01'
  end: '2021-01-01'
eval_range:
  start: '2021-01-01'
  end: '2022-01-01'
algorithm:
  name: ppo
  hyperparams:
    n_steps: 256
    batch_size: 512
    learning_rate: 0.0003
    gamma: 0.999
    ent_coef: 0.001
network:
  name: mlp
  kwargs:
    features_dim: 128
run:
  total_timesteps: 100000
  seed: 42
  device: cpu
  n_envs: 8
  vec_env: dummy
  decision_interval: 24
  residual: none
  rank_allocation: none
