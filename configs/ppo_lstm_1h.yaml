# Hourly real-data experiment: PPO + MLP, realistic retail-like costs.
# Spreads: ~0.2 pip USDJPY (0.0015bp of notional), ~0.4 pip EURJPY.
# Train: 2024-07..2025-12 (~9.2k bars) / Eval: 2026-01..2026-05 (~2.5k bars).
experiment: ppo_lstm_1h
env:
  environment:
    seed: 42
    initial_balance_jpy: 1000000.0
    episode_max_steps: 512 # ~1 month of hourly bars per episode
    window_size: 32
    max_leverage: 5.0
    margin_call_threshold: 0.2
    allow_action_leverage: false
    random_start: true
    currency_pairs: ["JPY/USD", "JPY/EUR"]
  data:
    provider: file
    timeframe: "1h"
    path: data/jpy_usd_eur_1h.parquet
  features:
    volatility_window: 32
    normalize: true
    selected: [log_return, volatility, rsi14, sma20_ratio, macd_ratio, atr14_ratio]
  transaction_costs:
    commission_rate: 0.0
    overnight_rate: 0.00005
    spreads:
      JPY/USD: 0.000015
      JPY/EUR: 0.000025
train_range: { start: "2024-07-01", end: "2026-01-01" }
eval_range: { start: "2026-01-01", end: "2026-06-01" }
algorithm:
  name: ppo
  hyperparams:
    n_steps: 256
    batch_size: 512
    learning_rate: 3.0e-4
    gamma: 0.999
    ent_coef: 0.001
network:
  name: lstm
  kwargs: { features_dim: 128, hidden_size: 64 }
run:
  total_timesteps: 500000
  seed: 42
  device: cpu
  n_envs: 8
  vec_env: dummy
