# forex-env config used only by forex-env-fetch to materialize the hourly
# JPY/USD + JPY/EUR cache: data/jpy_usd_eur_1h.parquet.
# Note: yfinance limits 60m bars to roughly the last 730 days.
environment:
  seed: 42
  initial_balance_jpy: 1000000.0
  episode_max_steps: 512
  window_size: 32
  max_leverage: 5.0
  margin_call_threshold: 0.2
  allow_action_leverage: false
  random_start: false
  currency_pairs: ["JPY/USD", "JPY/EUR"]

data:
  provider: yfinance
  start_date: "2024-07-01"
  end_date: "2026-06-01"
  timeframe: "1h"

features:
  volatility_window: 32
  normalize: true
  selected: []

transaction_costs:
  commission_rate: 0.0
  overnight_rate: 0.00005
  carry_mode: none
  spreads:
    JPY/USD: 0.000015
    JPY/EUR: 0.000025
