# Daily real-data baseline: PPO + MLP on the parquet cache.
# Prerequisite: uv run forex-env-fetch --config configs/fetch_1d.yaml --output data/jpy_usd_eur_1d.parquet
experiment: ppo_mlp_daily
env:
  environment:
    seed: 42
    initial_balance_jpy: 1000000.0
    episode_max_steps: 128
    window_size: 32
    max_leverage: 5.0
    margin_call_threshold: 0.2
    allow_action_leverage: false
    random_start: true
    currency_pairs: ["JPY/USD", "JPY/EUR"]
  data:
    provider: file
    timeframe: "1d"
    path: data/jpy_usd_eur_1d.parquet
  features:
    volatility_window: 32
    normalize: true
    selected: [log_return, volatility, rsi14, sma20_ratio]
  transaction_costs:
    commission_rate: 0.0002
    overnight_rate: 0.0001
    spreads:
      JPY/USD: 0.0002
      JPY/EUR: 0.0002
train_range: { start: "2023-01-01", end: "2025-03-31" }
val_range: { start: "2025-03-31", end: "2025-06-30" }
eval_range: { start: "2025-07-01", end: "2025-12-31" }
algorithm:
  name: ppo
  hyperparams: { n_steps: 256, batch_size: 256, learning_rate: 3.0e-4, gamma: 0.999 }
network:
  name: mlp
  kwargs: { features_dim: 128 }
run:
  total_timesteps: 20000
  seed: 42
  device: auto
  n_envs: 4
  vec_env: dummy
  decision_interval: 1
