[project]
name = "forex-trainer"
version = "0.1.0"
description = "RL agent training and experiment harness for forex-env-v3"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Forex-Trainer Authors" }]

dependencies = [
  "forex-env-v3",
  "stable-baselines3>=2.6",
  "sb3-contrib>=2.6",
  "torch>=2.6",
  "tensorboard>=2.18",
  "numpy>=2.3",
  "pandas>=2.3",
  "PyYAML>=6.0",
]

[project.scripts]
forex-train = "forex_trainer.train:main"
forex-eval = "forex_trainer.evaluate:main"
forex-period-eval = "forex_trainer.full_period:main"
forex-cost-campaign = "forex_trainer.cost_campaign:main"
forex-profit-attribution = "forex_trainer.profit_attribution:main"
forex-compare = "forex_trainer.compare:main"
forex-fetch-dukascopy = "forex_trainer.dukascopy:main"
forex-ensemble-eval = "forex_trainer.ensemble:main"
forex-add-carry = "forex_trainer.carry:main"
forex-selection-study = "forex_trainer.selection_study:main"
forex-clean-spikes = "forex_trainer.data_quality:main"
forex-data-scaling = "forex_trainer.data_scaling:main"
forex-report = "forex_trainer.report:main"
forex-regime-study = "forex_trainer.regime_study:main"
forex-supervised-ranking = "forex_trainer.supervised_ranking_study:main"
forex-supervised-portfolio = "forex_trainer.supervised_portfolio_study:main"
forex-turnover-diagnostic = "forex_trainer.turnover_diagnostic:main"
forex-spread-decomposition = "forex_trainer.spread_decomposition:main"

[dependency-groups]
dev = [
  "jsonschema>=4.25.1",
  "pytest>=8.0",
  "rfc3339-validator>=0.1.4",
]

[tool.uv.sources]
# The two repositories are expected to sit side by side (see ADR-0001).
forex-env-v3 = { path = "../forex-env-v3", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forex_trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
