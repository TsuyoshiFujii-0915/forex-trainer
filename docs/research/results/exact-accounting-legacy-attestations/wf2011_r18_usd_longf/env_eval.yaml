environment:
  seed: 42
  initial_balance_jpy: 1000000.0
  episode_max_steps: 1000000
  window_size: 32
  max_leverage: 5.0
  margin_call_threshold: 0.2
  allow_action_leverage: false
  random_start: false
  currency_pairs:
  - USD/JPY
  - USD/EUR
  - USD/GBP
  - USD/AUD
  - USD/CAD
  - USD/CHF
  - USD/NZD
  - USD/NOK
  - USD/SEK
data:
  provider: file
  timeframe: 1d
  path: /Users/tsuyoshi/workspace/01_Projects/forex-trainer/data/usd_9pairs_1d_factors.parquet
  start_date: '2011-01-01'
  end_date: '2012-01-01'
features:
  volatility_window: 32
  normalize: false
  selected:
  - log_return
  - volatility
  - sma20_ratio
  - mom24
  - xz_mom24
  - xr_mom24
  - carry_annual
  - xz_carry
transaction_costs:
  commission_rate: 0.0
  overnight_rate: 2.0e-05
  carry_mode: signed
  spreads:
    USD/JPY: 1.5e-05
    USD/EUR: 1.5e-05
    USD/GBP: 2.0e-05
    USD/AUD: 2.0e-05
    USD/CAD: 2.0e-05
    USD/CHF: 2.0e-05
    USD/NZD: 3.0e-05
    USD/NOK: 4.0e-05
    USD/SEK: 4.0e-05
